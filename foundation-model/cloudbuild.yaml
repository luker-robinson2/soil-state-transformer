steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/your-gcp-project/sst/sst-training:latest', '-f', 'docker/Dockerfile.training', '.']
images:
  - 'us-central1-docker.pkg.dev/your-gcp-project/sst/sst-training:latest'
options:
  machineType: 'E2_HIGHCPU_8'
timeout: '3600s'
