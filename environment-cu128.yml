# CUDA 12.8 environment for GeoSoil on CU Alpine RTX Pro 6000 (Blackwell, partition artxpro6000); also runs on H200/A100.
# Build: module load miniforge; conda env create -f environment-cu128.yml; conda activate geosoil-cu128
# Then (needs a CUDA toolchain loaded — `module load cuda`):
#   pip install --no-build-isolation causal-conv1d>=1.2 mamba-ssm>=2.2
# (mamba-ssm compiles a CUDA kernel; ensure nvcc CUDA major matches the torch cu12 build.)
name: geosoil-cu128
channels: [conda-forge]
dependencies:
  - python=3.11
  - pip
  - pip:
      # torch with CUDA 12.8 wheels (Blackwell needs CUDA >= 12.8)
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch>=2.7,<2.9
      - numpy>=1.26
      - pandas>=2.0
      - pyarrow>=14
      - scikit-learn>=1.4
      - scipy>=1.11
      - matplotlib>=3.8
      - umap-learn>=0.5
      - einops>=0.7            # mamba-ssm dependency
      - lightgbm>=4.0
      - xgboost>=2.0
      - catboost>=1.2
      - earthengine-api>=0.1.380
      - requests
      - rasterio>=1.4         # AlphaEarth COG reads (scripts/corpus)
      - pyproj>=3.6
      - geopandas>=1.0          # lithology polygon lookups
      - pyogrio>=0.9
      - pytest>=8
      # mamba-ssm + causal-conv1d installed AFTER env create (need nvcc), see header.
