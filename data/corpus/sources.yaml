# GeoSoil corpus source registry.
# Every dataset or model that feeds the corpus is listed here BEFORE any code downloads it.
# See docs/research/CORPUS-PLAN.md and CONTRIBUTING.md.
#
# status:  lead      -> found, not checked
#          verified  -> count, license and access checked on `checked`
#          ingested  -> loader merged; `loader` points at it
# role:    label | pseudo_label (pretraining ablation only, never evaluation) | input | embedding | model
# redistribute: may derived rows be committed to this public repo?

sources:
  - id: kssl_ldm
    name: NCSS/KSSL Lab Data Mart
    role: label
    size: "~65k profiles (soilDB docs)"
    license: public domain
    redistribute: true
    access: https://ncsslabdatamart.sc.egov.usda.gov/ (SQLite / GeoPackage, monthly)
    status: ingested
    checked: 2026-11-16
    status_detail: "ingested 2026-11-16 from the labtaxa 2026.07 mirror: 52,340 georeferenced pedons, 1.51M values"
    loader: data/extraction/kssl_export.R + geosoil/corpus/kssl.py
    mirror: https://github.com/brownag/labtaxa/releases (monthly cached-LDM-SPC.rds)
    notes: repo used ~3k pedons before (alphaearth-soc/future_work/data/kssl_with_features.csv)

  - id: wosis_2023
    name: ISRIC WoSIS 2023 snapshot
    role: label
    size: "228k profiles, 217k sites, 174 countries"
    license: per-profile CC-BY-4.0 or CC-BY-NC-4.0 (filter on license column)
    redistribute: CC-BY rows only
    access: "https://files.isric.org/public/wosis_snapshot/WoSIS_2023_December.zip"
    status: ingested
    checked: 2026-11-16
    loader: geosoil/corpus/wosis.py
    notes: CONUS slice on disk as alphaearth-soc/future_work/data/wosis_conus.csv (37,311 rows); overlaps NCSS
    requested: "2026-11-16 (email to wosis@isric.org: license reading, restricted-provider contacts, next snapshot)"
    status_detail: "152,716 sites, 1.33M values after dropping US-NCSS (= KSSL); 120,668 sites kept after dedup"
  - id: ossl_v1_2
    name: Open Soil Spectral Library v1.2
    role: label
    size: "135,651 samples (87,707 georeferenced); MIR 82,573, VisNIR 64,644"
    license: mixed CC-BY / CC-BY-SA / ODbL; LUCAS rows under JRC license
    redistribute: non-LUCAS rows, per source license
    access: "https://storage.googleapis.com/soilspec4gg-public/ossl_soilsite_L0_v1.2.csv.gz + ossl_soillab_L1_v1.2.csv.gz"
    status: ingested
    checked: 2026-11-16
    notes: KSSL slice duplicates kssl_ldm (join on labsampnum)
    loader: geosoil/corpus/ossl.py
    status_detail: "non-KSSL, non-LUCAS rows: 2,083 sites; 494 kept after dedup (most are in WoSIS)"
  - id: raca
    name: USDA Rapid Carbon Assessment
    role: label (hold-out)
    size: "6,017 sites, 32,084 pedons, 144,833 samples to 100 cm"
    license: public domain
    redistribute: true
    access: "https://nrcs.box.com/index.php?rm=box_download_shared_file&shared_name=s9bcdroihv1vyre70bkl336cdr13up7q (samples f_1031424800228, locations f_1031428176175)"
    status: ingested
    checked: 2026-11-16
    notes: site coordinates deliberately degraded; final SOC hold-out, not for 10 m pixel matching
    loader: geosoil/corpus/raca.py
    status_detail: "hold-out: 6,367 sites, 33k lab SOC + 82k measured BD values; coords rounded ~1 km"
  - id: lucas_topsoil
    name: LUCAS topsoil 2009/2015/2018/2022
    role: label
    size: "~20k / 22k / 19k (unverified) / 33k locations"
    license: JRC ESDAC license agreement (request form)
    redistribute: false
    access: https://esdac.jrc.ec.europa.eu/content/lucas-2022-topsoil-data (2022 public likely Q1 2027, registration)
    status: verified
    checked: 2026-11-16
    notes: transfer test only; never commit rows
    requested: "2026-11-16 (email to ec-esdac@ec.europa.eu: 2022 early access, 2009-2018 process, model-weight release terms)"

  - id: usgs_ds801
    name: USGS Geochemical and mineralogical data for soils of the conterminous US (DS 801)
    role: label
    size: "4,857 sites, 3 depths"
    license: public domain
    redistribute: true
    access: "https://pubs.usgs.gov/ds/801/downloads/Appendix_3b_Ahorizon_18Sept2013.txt"
    status: ingested
    checked: 2026-11-16
    loader: geosoil/corpus/usgs_ds801.py
    status_detail: "4,782 A-horizon SOC values (0-5 cm file has no carbon)"
  - id: gnatsgo_polaris_soilgrids_olm
    name: gNATSGO, POLARIS, SoilGrids 2.0, OpenLandMap soil layers
    role: pseudo_label
    license: public domain / public domain / CC-BY-4.0 / CC-BY-SA-4.0
    redistribute: per layer (OpenLandMap derivatives are share-alike)
    status: verified
    checked: 2026-11-16
    notes: model products; ablation only. Current OpenLandMap labels live in soil_unified.csv

  - id: era5_land
    name: ERA5-Land (ARCO Zarr / CDS)
    role: input
    license: Copernicus licence (free, attribution)
    redistribute: derived features yes
    access: Earth Data Hub ARCO Zarr (free token) or CDS; ARCO-ERA5 gs://gcp-public-data-arco-era5
    status: verified
    checked: 2026-11-16

  - id: planetary_computer
    name: Planetary Computer STAC (MODIS 6.1, Daymet, gridMET, TerraClimate, S1 RTC, S2 L2A, HLS, Copernicus DEM, 3DEP, WorldCover)
    role: input
    license: per collection (mostly open / public domain)
    redistribute: derived features yes (check per collection)
    access: https://planetarycomputer.microsoft.com/ (free SAS token)
    status: verified
    checked: 2026-11-16

  - id: smap
    name: SMAP L3/L4 soil moisture
    role: input
    license: NASA open data
    redistribute: true
    access: earthaccess (NASA Earthdata login)
    status: verified
    checked: 2026-11-16

  - id: usgs_radiometrics
    name: USGS NURE airborne radiometric (K/U/Th) Bayesian grids, CONUS
    role: input
    license: public domain
    redistribute: true
    access: https://www.usgs.gov/data/bayesian-modeling-nure-airborne-radiometric-data-conterminous-united-states-predictions-and
    status: verified
    checked: 2026-11-16

  - id: alphaearth
    name: AlphaEarth Foundations Satellite Embedding v1
    role: embedding
    size: "64-d, 10 m, annual 2017-2025 (302,466 tiles); band-interleaved 1024px zstd blocks"
    license: CC-BY-4.0 (attribution "Google and Google DeepMind")
    redistribute: derived point features yes, with attribution
    access: s3://us-west-2.opendata.source.coop/tge-labs/aef (free, not requester-pays; aef_index.gpkg, aef-loader); the GCS bucket is requester-pays
    status: verified
    checked: 2026-11-16
    notes: weights not public. Measured 2026-11-16 - scattered ~38 MB per point-year, dense ~38.5 B per pixel; build the corpus from whole blocks

  - id: tessera
    name: TESSERA embeddings and models (Cambridge)
    role: embedding
    size: "128-d Matryoshka, 10 m, 2024 only so far (2017-2024 planned); students 1M-44M"
    license: embeddings CC-BY, weights CC0, plus Acceptable Use Policy
    redistribute: derived point features yes, with attribution
    access: pip install geotessera; https://huggingface.co/geotessera
    status: verified
    checked: 2026-11-16

  - id: galileo
    name: Galileo (nasaharvest)
    role: model
    size: "Nano / Tiny / Base (85M)"
    license: verify in repo (reported MIT)
    access: https://github.com/nasaharvest/galileo ; HF nasaharvest/galileo
    status: lead
    notes: closest input match; baseline + temporal-encoder init

  - id: presto
    name: Presto (nasaharvest)
    role: model
    size: "~0.4M"
    license: verify in repo (reported MIT)
    access: https://github.com/nasaharvest/presto
    status: lead

  - id: iscn3
    name: International Soil Carbon Network Gen3
    role: label
    size: "71,198 profiles, 431,324 layers, 67,112 sites"
    license: per contributor
    redistribute: per contributor
    access: EDI package edi.360
    status: not_pullable
    checked: 2026-11-16
    notes: heavily overlaps NRCS; dedupe against kssl_ldm
    status_detail: "EDI requires login for every REST download since 2026-07-30; the package is edi.1160 rev 1 (not edi.360)"
  - id: brazil_soildata
    name: SoilData / MapBiomas Solo (Brazil)
    role: label
    size: "45k+ samples at 15k points; 28,065 SOC-stock points"
    license: mostly CC-BY
    redistribute: CC-BY datasets
    access: "https://repositorio.soildata.mapbiomas.org/api/access/datafile/832"
    status: ingested
    checked: 2026-11-16
    loader: geosoil/corpus/brazil.py
    status_detail: "9,199 georeferenced sites, 119.5k values; 27.5k source rows are CC BY-NC"
  - id: lucas_mega
    name: LUCAS-MEGA harmonized LUCAS 2009-2018
    role: label
