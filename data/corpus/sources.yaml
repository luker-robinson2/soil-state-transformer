    checked: 2026-11-16

  - id: planetary_computer
    name: Planetary Computer STAC (MODIS 6.1, Daymet, gridMET, TerraClimate, S1 RTC, S2 L2A, HLS, Copernicus DEM, 3DEP, WorldCover)
