    role: model
    size: "Nano / Tiny / Base (85M)"
    license: verify in repo (reported MIT)
    access: https://github.com/nasaharvest/galileo ; HF nasaharvest/galileo
    status: lead
    notes: closest input match; baseline + temporal-encoder init

  - id: presto
