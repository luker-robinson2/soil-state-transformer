# GeoSoil corpus source registry.
# Every dataset or model that feeds the corpus is listed here BEFORE any code downloads it.
# See docs/research/CORPUS-PLAN.md and CONTRIBUTING.md.
#
# status:  lead      -> found, not checked
#          verified  -> count, license and access checked on `checked`
#          ingested  -> loader merged; `loader` points at it
# role:    label | pseudo_label (pretraining ablation only, never evaluation) | input | embedding | model
# redistribute: may derived rows be committed to this public repo?

sources:
  - id: kssl_ldm
    name: NCSS/KSSL Lab Data Mart
    role: label
    size: "~65k profiles (soilDB docs)"
    license: public domain
    redistribute: true
    access: https://ncsslabdatamart.sc.egov.usda.gov/ (SQLite / GeoPackage, monthly)
    status: ingested
    checked: 2026-11-16
    status_detail: "ingested 2026-11-16 from the labtaxa 2026.07 mirror: 52,340 georeferenced pedons, 1.51M values"
    loader: data/extraction/kssl_export.R + geosoil/corpus/kssl.py
    mirror: https://github.com/brownag/labtaxa/releases (monthly cached-LDM-SPC.rds)
    notes: repo used ~3k pedons before (alphaearth-soc/future_work/data/kssl_with_features.csv)

  - id: wosis_2023
    name: ISRIC WoSIS 2023 snapshot
    role: label
    size: "228k profiles, 217k sites, 174 countries"
    license: per-profile CC-BY-4.0 or CC-BY-NC-4.0 (filter on license column)
    redistribute: CC-BY rows only
    access: "https://files.isric.org/public/wosis_snapshot/WoSIS_2023_December.zip"
    status: ingested
    checked: 2026-11-16
    loader: geosoil/corpus/wosis.py
    notes: CONUS slice on disk as alphaearth-soc/future_work/data/wosis_conus.csv (37,311 rows); overlaps NCSS
    requested: "2026-11-16 (email to wosis@isric.org: license reading, restricted-provider contacts, next snapshot)"
    reply: "2026-11-16 bounced: wosis@isric.org only accepts internal senders. 2026-11-17 resent via the isric.org/contact-us form, asking them to forward it to the WoSIS team; 2026-11-18 also emailed soils@isric.org (same questions + exchangeable bases). No answer yet"
    status_detail: "152,716 sites, 1.33M values after dropping US-NCSS (= KSSL); 120,668 sites kept after dedup"
